<!doctype html>
<html lang="zh-CN" class="__ARCHIVE_MODE__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; media-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>微信收藏归档</title>
<style>
__ARCHIVE_SHELL_CSS__
h2,p{margin:0}
h2{font-size:17px;line-height:1.45;font-weight:600;overflow-wrap:anywhere}
.notice{font-size:12px;color:var(--muted-foreground)}
summary{cursor:pointer}
a{overflow-wrap:anywhere}
a:focus-visible,summary:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
#items{display:grid;gap:20px}
.archive-entry{line-height:1.6}
.card-meta,.card-footer{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.card-meta{gap:5px 10px;margin-bottom:7px;color:var(--muted-foreground);font-size:12px}
.card-meta time{margin-inline-start:auto;font-variant-numeric:tabular-nums}
.category{padding:1px 8px;border-radius:6px;background:var(--secondary);color:var(--secondary-foreground)}
.copy{white-space:pre-wrap;overflow-wrap:anywhere}
.intro{margin-top:8px}
.entry-flow{display:grid;gap:10px;margin-top:12px}
.block{min-width:0;display:grid;gap:6px}
.block-title{font-weight:600}
.sender{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}
.sender strong{color:var(--primary);font-weight:600}
.transcript,.nested-flow{padding:10px 12px;border-inline-start:2px solid var(--border);background:var(--muted);border-radius:0 8px 8px 0}
.transcript>.block+.block{border-top:1px solid var(--border);padding-top:9px}
.resource{min-width:0}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:640px}
.gallery.single{display:block;max-width:540px}
.photo-link{display:block;border-radius:8px;background:var(--muted);overflow:hidden}
.photo-link img{display:block;max-width:100%;width:100%;height:auto;max-height:440px;object-fit:contain}
.gallery.single .photo-link{width:fit-content;max-width:100%}
.gallery.single img{width:auto}
.gallery:not(.single) img{height:140px}
.resource audio,.resource video{display:block;max-width:100%;border-radius:8px}
.resource video{max-height:440px}
.media-download{display:inline-block;margin-top:4px;font-size:12px}
.attachment{display:inline-flex;align-items:center;width:fit-content;max-width:100%;padding:5px 9px;border-radius:7px;background:var(--muted);font-size:12px}
.expand{margin-top:12px}
.expand>summary{width:fit-content;padding:5px 9px;border-radius:7px;background:var(--muted);color:var(--primary);font-size:13px}
.expand>.entry-flow{margin-top:9px}
.card-footer{justify-content:flex-start;margin-top:12px;padding-top:9px;border-top:1px solid var(--border)}
.card-footer a{font-size:12px}
.empty{padding:3rem 1rem;text-align:center;color:var(--muted-foreground)}
@media(max-width:600px){
  .gallery{grid-template-columns:repeat(2,minmax(0,1fr))}
  .gallery:not(.single) img{height:110px}
}
@media print{.transcript,.nested-flow{background:transparent}}

__ARCHIVE_GLASS__
</style>
</head>
<body>
<header class="archive-glass-bar">
  <div id="header-panel"><div class="header-clip"><div id="header-content">
    <h1 id="title"></h1>
    <div id="meta"></div>
    <div class="filters">
      <label class="search">搜索标题、正文或来源<input id="query" type="search" placeholder="搜索这份归档" aria-label="搜索收藏内容"></label>
      <label>收藏类型<select id="type"><option value="">全部类型</option></select></label>
      <moect-date-range id="date-range"></moect-date-range>
      <button id="go" type="button">筛选</button>
      <button id="reset" type="button">显示全部</button>
      <button id="print" type="button">打印 / 保存 PDF</button>
    </div>
    <p id="status" class="archive-selection" role="status"></p>
    <div class="downloads">
      <a class="download" href="data.json" download>归档 JSON</a>
      <a class="download" href="resource-report.jsonl" download>资源明细</a>
    </div>
    <details class="archive-note"><summary>归档说明</summary><p id="notice"></p></details>
  </div></div></div>
</header>
<main id="items"></main>
<footer id="archive-pagination" class="archive-glass-bar"></footer>
<script>__ARCHIVE_SHELL__</script>
<script>__DATE_RANGE_PICKER__</script>
<script>__ARCHIVE_MEDIA__</script>
<script>__ARCHIVE_PRINT__</script>
<script src="builtin-faces.js"></script>
<script>__INLINE_FACES__</script>
<script>
const data=__FAVORITES__;
const $=selector=>document.querySelector(selector),local=MoectMedia.localPath;
const pageSize=40;
const clock=new Intl.DateTimeFormat('zh-CN',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Shanghai'});
const searchText=new WeakMap();
let page=0,start='',end='';
MoectArchive.mountHeader();
const pager=MoectArchive.mountPager({pageSize,label:'收藏分页',onPage:index=>{page=index;render();scrollTo(0,0)}});

function node(tag,cls,text){
  const el=document.createElement(tag);
  if(cls)el.className=cls;
  if(text){
    if(cls?.includes('copy'))MoectFaces.append(el,text);
    else el.textContent=text;
  }
  return el;
}

function external(value){
  try{
    const url=new URL(value);
    return ['https:','http:'].includes(url.protocol)&&!url.username&&!url.password?url.href:'';
  }catch{return ''}
}

function link(href,label,cls='',download=false){
  const a=node('a',cls,label);
  a.href=href;
  a.target='_blank';a.rel='noopener noreferrer';
  if(download)a.download='';
  return a;
}

function renderResources(parent,resources){
  let gallery;
  for(const resource of resources||[]){
    const href=local(resource.path);
    if(!href)continue;
    if(resource.kind==='image'){
      if(!gallery){
        gallery=node('div','resource gallery single');
        parent.append(gallery);
      }else gallery.classList.remove('single');
      const a=link(href,'','photo-link');
      const image=node('img');
      image.src=href;
      image.alt=resource.role==='thumbnail'?'收藏图片缩略图':'收藏图片';
      image.loading='lazy';
      image.decoding='async';
      a.append(image);gallery.append(a);
      continue;
    }
    gallery=null;
    const wrap=node('div','resource');
    if(resource.kind==='audio'||resource.kind==='video'){
      const media=node(resource.kind);
      media.src=href;media.controls=true;media.preload='none';
      wrap.append(media,link(href,resource.kind==='audio'?'下载音频':'下载视频','media-download',true));
    }else{
      const filename=String(resource.name||'');
      const useful=filename&&!/^[a-f0-9]{24,64}(?:\.[a-z0-9]+)?$/i.test(filename);
      wrap.append(link(href,useful?filename:'下载原始附件','attachment',true));
    }
    parent.append(wrap);
  }
}

function renderBlock(block,repeated){
  const el=node('section','block');
  if(block.sender||block.time){
    const sender=node('div','sender');
    if(block.sender)sender.append(node('strong','',block.sender));
    if(block.time)sender.append(node('span','',block.time));
    el.append(sender);
  }
  const hideTitle=!block.sender&&repeated?.text.has((block.title||'').trim());
  const hideText=!block.sender&&repeated?.text.has((block.text||'').trim());
  if(block.title&&!hideTitle&&!(block.title==='文章图片'&&(block.resources||[]).length))el.append(node('p','block-title',block.title));
  if(block.text&&!hideText&&block.text!==block.title)el.append(node('p','copy',block.text));
  const href=external(block.link);
  if(href&&(href!==repeated?.link||block.sender))el.append(link(href,'打开原链接','attachment'));
  renderResources(el,block.resources);
  if(block.notice)el.append(node('p','notice',block.notice));
  if(block.children?.length)el.append(renderFlow(block.children,'nested-flow'));
  return el;
}

function renderFlow(blocks,cls,repeated){
  const flow=node('div','entry-flow '+cls);
  for(const block of blocks){
    const content=renderBlock(block,repeated);
    if(content.childElementCount)flow.append(content);
  }
  return flow;
}

function card(item,printing=false){
  const el=node('article','card archive-entry');
  const meta=node('div','card-meta');
  meta.append(node('span','category',item.type_name));
  if(item.source)meta.append(node('span','',item.source));
  if(item.create_time){
    const date=new Date(item.create_time*1000);
    if(Number.isFinite(date.getTime()))meta.append(node('time','',clock.format(date)));
  }
  el.append(meta,node('h2','',item.title));
  if(item.text&&(item.text||'').trim()!==(item.title||'').trim())el.append(node('p','copy intro',item.text));
  const url=external(item.link);
  const repeated=item.type===14?null:{text:new Set([(item.title||'').trim(),(item.text||'').trim()]),link:url};
  const blocks=item.blocks||[];
  const flow=()=>renderFlow(blocks,item.type===14?'transcript':'',repeated);
  if(blocks.length>6||item.type===14&&blocks.length>3){
    const details=node('details','expand');
    const label=item.type===14?'查看聊天记录':item.type===5?'阅读正文':'展开内容';
    details.append(node('summary','',label));
    const populate=()=>{if(details.childElementCount===1)details.append(flow())};
    if(printing){populate();details.open=true}
    else details.addEventListener('toggle',()=>{if(details.open)populate()});
    el.append(details);
  }else if(blocks.length){
    const body=flow();
    if(body.childElementCount)el.append(body);
  }
  if(item.article_notice)el.append(node('p','notice intro',item.article_notice));
  const markdown=local(item.markdown);
  if(url||markdown){
    const actions=node('div','card-footer');
    if(url)actions.append(link(url,'打开原链接'));
    if(markdown)actions.append(link(markdown,'Markdown'));
    el.append(actions);
  }
  return el;
}

function timestamp(value,last=false){
  if(value.length===10)value+='T'+(last?'23:59:59':'00:00:00');
  else if(value.length===16)value+=last?':59':':00';
  return Date.parse(value+'+08:00')/1000;
}

function textForSearch(item){
  if(searchText.has(item))return searchText.get(item);
  const parts=[item.title,item.text,item.source,item.link,item.type_name];
  const collect=block=>{
    parts.push(block.title,block.text,block.sender,block.time,block.link,block.notice);
    for(const resource of block.resources||[])parts.push(resource.name);
    for(const child of block.children||[])collect(child);
  };
  for(const block of item.blocks||[])collect(block);
  const text=parts.filter(Boolean).join(' ').toLocaleLowerCase();
  searchText.set(item,text);
  return text;
}

function rows(){
  const query=$('#query').value.trim().toLocaleLowerCase(),type=$('#type').value;
  const from=start?timestamp(start):null,to=end?timestamp(end,true):null;
  return data.items.filter(item=>(!type||String(item.type)===type)&&(from===null||item.create_time>=from)&&
    (to===null||item.create_time<=to)&&(!query||textForSearch(item).includes(query)));
}

function render(){
  const matched=rows();
  page=MoectArchive.paginationModel(matched.length,page,pageSize).selected;
  const items=$('#items');
  const visible=matched.slice(page*pageSize,(page+1)*pageSize);
  items.replaceChildren(...(visible.length?visible.map(item=>card(item)):[node('p','empty','没有符合条件的收藏')]));
  $('#status').textContent=matched.length===data.items.length?'共 '+matched.length+' 条收藏':
    '匹配 '+matched.length+' / '+data.items.length+' 条收藏';
  pager.update(matched.length,page);
}

$('#title').textContent=data.name;
document.title=data.name+' · Moect';
$('#meta').textContent='导出于 '+data.exported_at.replace('T',' ');
$('#notice').textContent=data.notice;
for(const [id,label] of new Map(data.items.map(item=>[item.type,item.type_name]))){
  const option=node('option','',label);
  option.value=id;$('#type').append(option);
}
$('#go').onclick=$('#query').oninput=$('#type').onchange=()=>{page=0;render()};
$('#query').onkeydown=event=>{if(event.key==='Enter')$('#go').click()};
$('#date-range').addEventListener('range-change',event=>{start=event.detail.start;end=event.detail.end;page=0;render()});
$('#reset').onclick=()=>{
  $('#query').value=$('#type').value='';start=end='';
  $('#date-range').setAttribute('start','');$('#date-range').setAttribute('end','');page=0;render();
};
$('#print').onclick=async()=>{
  try{
    await MoectPrint.print({
      title:data.name,description:$('#status').textContent,
      render:root=>{const matched=rows();for(const item of matched)root.append(card(item,true));return matched.length}
    });
  }catch(error){$('#status').textContent=error.message}
};
render();
MoectMedia.mount($('#items'));
</script>
</body>
</html>
